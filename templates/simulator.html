<!doctype html>
<html>
<body>
  <h1>Investment simulator</h1>
  <label>Years: <span id="years-label">10</span></label><br>
  <input type="range" id="years" min="1" max="40" value="10">

  <p>After these years you would have: <strong id="result">...</strong></p>
  <p><small>Illustrative only: assumes €1,000 to start, €100 a month and 5% a year. Not a prediction.</small></p>

  <script>
    const slider = document.getElementById("years");

    // Ask your Python API for the numbers, then show the last balance.
    async function update() {
      document.getElementById("years-label").textContent = slider.value;

      const url = "/api/simulate?initial=1000&monthly=100&rate=0.05&years=" + slider.value;
      const response = await fetch(url);      // send the request to app.py
      const points = await response.json();   // turn the reply into a JS list

      const last = points[points.length - 1]; // the final year
      document.getElementById("result").textContent = "€" + last.balance;
    }

    slider.oninput = update;  // run update() every time the slider moves
    update();                 // and once when the page first opens
  </script>
</body>
</html>
